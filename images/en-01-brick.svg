<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#656d76"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">Why does it brick on load?</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#656d76">The hang chain of AIC8800DC (MCU1 batch) dongles</text>

  <rect x="180" y="95" width="600" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-size="16" fill="#1f2328">① insmod the driver — everything looks fine</text>

  <line x1="480" y1="151" x2="480" y2="177" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="180" y="180" width="600" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="215" text-anchor="middle" font-size="16" fill="#1f2328">② Unconditional DPD calibration start (CONFIG_FORCE_DPD_CALIB=y)</text>

  <line x1="480" y1="236" x2="480" y2="262" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="180" y="265" width="600" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="480" y="291" text-anchor="middle" font-size="16" fill="#1f2328">③ START_APP cmd 1037 (FNCALL 0x130009)</text>
  <text x="480" y="311" text-anchor="middle" font-size="13" fill="#7d4e00">the MCU1 chip receives a command it does not know</text>

  <line x1="480" y1="321" x2="480" y2="347" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="180" y="350" width="600" height="56" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
  <text x="480" y="385" text-anchor="middle" font-size="16" fill="#1f2328">④ ~4 s timeout → driver issues a USB reset</text>

  <line x1="480" y1="406" x2="480" y2="432" stroke="#cf222e" stroke-width="2" marker-end="url(#arrR)"/>

  <rect x="180" y="435" width="600" height="56" rx="10" fill="#cf222e"/>
  <text x="480" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕ Chip dead: device descriptor read/64, error -110</text>

  <rect x="120" y="508" width="720" height="38" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1"/>
  <text x="480" y="532" text-anchor="middle" font-size="14" fill="#cf222e">Software reset / USB port reset / PC reboot — all useless. Only fix: unplug for ≥ 10 s</text>
</svg>
