<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2da44e"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">The fix: three layers</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#656d76">Any single layer stops the calibration firmware from ever being uploaded</text>

  <rect x="30" y="100" width="286" height="196" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="173" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">Layer 1: Factory-calib check</text>
  <text x="173" y="164" text-anchor="middle" font-size="13" fill="#1f2328">Read boot arg 0x1220f0 bit4</text>
  <text x="173" y="186" text-anchor="middle" font-size="13" fill="#1f2328">set → calib valid, skip</text>
  <text x="173" y="214" text-anchor="middle" font-size="13" fill="#1f2328">else read flash size (0x40038030)</text>
  <text x="173" y="236" text-anchor="middle" font-size="13" fill="#1f2328">locate DPD info (0xfe004 offset)</text>
  <text x="173" y="266" text-anchor="middle" font-size="13" fill="#1f2328">bit7 set → valid, skip</text>

  <rect x="337" y="100" width="286" height="196" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="480" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1a7f37">Layer 2: Kill switch (off)</text>
  <text x="480" y="166" text-anchor="middle" font-size="13.5" fill="#1f2328">New module parameter</text>
  <text x="480" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">aicwf_dpd_fw_calib=0</text>
  <text x="480" y="224" text-anchor="middle" font-size="13" fill="#1f2328">unless explicitly enabled:</text>
  <text x="480" y="246" text-anchor="middle" font-size="13" fill="#1f2328">never uploads calib firmware</text>
  <text x="480" y="274" text-anchor="middle" font-size="13" fill="#1f2328">only misc_ram_init (12-byte clear)</text>

  <rect x="644" y="100" width="286" height="196" rx="12" fill="#fbefff" stroke="#c297e3" stroke-width="1.5"/>
  <text x="787" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#8250df">Layer 3: MCU1 compat</text>
  <text x="787" y="166" text-anchor="middle" font-size="13" fill="#1f2328">Cache register RMW (0x40100020)</text>
  <text x="787" y="196" text-anchor="middle" font-size="13" fill="#1f2328">patch_tbl_wifisetting +2 entries</text>
  <text x="787" y="226" text-anchor="middle" font-size="13" fill="#1f2328">(wdt 0x0004 / 0x0084)</text>
  <text x="787" y="258" text-anchor="middle" font-size="13" fill="#656d76">taken from the legacy</text>
  <text x="787" y="278" text-anchor="middle" font-size="13" fill="#656d76">pre-SDK-V5 loader profile</text>

  <line x1="173" y1="296" x2="173" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="480" y1="296" x2="480" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="787" y1="296" x2="787" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="173" y1="330" x2="787" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="480" y1="330" x2="480" y2="352" stroke="#2da44e" stroke-width="2.5" marker-end="url(#arrG)"/>

  <rect x="200" y="356" width="560" height="62" rx="12" fill="#1a7f37"/>
  <text x="480" y="385" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Start app succeeds in 0.3 s → wlan0 appears</text>
  <text x="480" y="408" text-anchor="middle" font-size="13" fill="#dafbe1">(before the fix: 4 s timeout + dead chip)</text>
</svg>
