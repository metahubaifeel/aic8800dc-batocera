<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">Batocera 开机时序：两个时序坑</text>
  <text x="480" y="68" text-anchor="middle" font-size="15" fill="#656d76">驱动工作正常，但和 Batocera 的启动脚本"对不上表" —— 需要专门的接力方案</text>

  <!-- trap 1 -->
  <rect x="30" y="86" width="432" height="82" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
  <text x="46" y="112" font-size="15" font-weight="700" fill="#cf222e">坑 1｜S00（开机第 0 秒）时 /userdata 还没挂载</text>
  <text x="46" y="136" font-size="13.5" fill="#1f2328">分区要 33 秒后才挂载；在 S00 里同步等待</text>
  <text x="46" y="156" font-size="13.5" fill="#1f2328">会把负责挂载它的脚本也堵死（死锁）</text>

  <!-- trap 2 -->
  <rect x="498" y="86" width="432" height="82" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
  <text x="514" y="112" font-size="15" font-weight="700" fill="#cf222e">坑 2｜S08connman 只等 wlan0 十五秒</text>
  <text x="514" y="136" font-size="13.5" fill="#1f2328">驱动 30 秒后才加载 → 必然等不到、直接放弃</text>
  <text x="514" y="156" font-size="13.5" fill="#1f2328">Wifi Hardware not detected after 15s</text>

  <!-- timeline axis -->
  <line x1="90" y1="345" x2="920" y2="345" stroke="#656d76" stroke-width="2"/>
  <path d="M920,345 L908,340 L908,350 Z" fill="#656d76"/>
  <text x="930" y="350" font-size="13" fill="#656d76">秒</text>

  <!-- event: 0s -->
  <circle cx="90" cy="345" r="6" fill="#0969da"/>
  <line x1="90" y1="339" x2="90" y2="316" stroke="#0969da" stroke-width="1.5"/>
  <rect x="60" y="252" width="252" height="62" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="74" y="276" font-size="14" font-weight="700" fill="#0969da">0s｜S00  boot-custom.sh</text>
  <text x="74" y="298" font-size="13" fill="#1f2328">写 udev 规则 + 拉起后台脚本</text>

  <!-- event: 10s -->
  <circle cx="252" cy="345" r="6" fill="#656d76"/>
  <line x1="252" y1="351" x2="252" y2="374" stroke="#656d76" stroke-width="1.5"/>
  <rect x="222" y="376" width="238" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="236" y="400" font-size="14" font-weight="700" fill="#57606a">10s｜S08connman 启动</text>
  <text x="236" y="422" font-size="13" fill="#1f2328">等 wlan0，最多 15 秒</text>

  <!-- event: 25s -->
  <circle cx="495" cy="345" r="6" fill="#cf222e"/>
  <line x1="495" y1="339" x2="495" y2="316" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="465" y="252" width="222" height="62" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.2"/>
  <text x="479" y="276" font-size="14" font-weight="700" fill="#cf222e">25s｜⚠️ S08 放弃等待</text>
  <text x="479" y="298" font-size="13" fill="#1f2328">Wifi not detected → 放弃</text>

  <!-- event: 33s + 35s merged box -->
  <circle cx="625" cy="345" r="6" fill="#0969da"/>
  <circle cx="657" cy="345" r="6" fill="#0969da"/>
  <line x1="625" y1="351" x2="625" y2="374" stroke="#0969da" stroke-width="1.5"/>
  <line x1="657" y1="351" x2="657" y2="374" stroke="#0969da" stroke-width="1.5"/>
  <rect x="595" y="376" width="300" height="78" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="609" y="400" font-size="13.5" font-weight="700" fill="#0969da">33s｜/userdata 挂载完成</text>
  <text x="609" y="422" font-size="13" fill="#1f2328">35s｜boot-late.sh 开始工作：</text>
  <text x="609" y="442" font-size="13" fill="#1f2328">eject 切模式 → insmod 驱动</text>

  <!-- event: 45s -->
  <circle cx="819" cy="345" r="6" fill="#1a7f37"/>
  <line x1="819" y1="339" x2="819" y2="316" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="789" y="252" width="158" height="62" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.2"/>
  <text x="803" y="276" font-size="14" font-weight="700" fill="#1a7f37">45s｜✓ wlan0 就绪</text>
  <text x="803" y="298" font-size="13" fill="#1f2328">WiFi 自动连接</text>

  <!-- bottom summary -->
  <rect x="150" y="492" width="660" height="54" rx="10" fill="#1a7f37"/>
  <text x="480" y="516" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">结果：全自动 —— 从开机到 WiFi 就绪，全程无人操作</text>
  <text x="480" y="536" text-anchor="middle" font-size="12.5" fill="#dafbe1">（无网线场景由 boot-late.sh 兜底主动连接已保存的 WiFi）</text>
</svg>
