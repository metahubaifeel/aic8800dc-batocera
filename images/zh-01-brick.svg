<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#656d76"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">为什么加载驱动就「变砖」？</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#656d76">AIC8800DC（MCU1 老批次）的卡死因果链</text>

  <!-- step 1 -->
  <rect x="200" y="95" width="560" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-size="17" fill="#1f2328">① insmod 加载驱动 —— 一切看起来正常</text>

  <line x1="480" y1="151" x2="480" y2="177" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="200" y="180" width="560" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="215" text-anchor="middle" font-size="17" fill="#1f2328">② 无条件启动 DPD 校准固件（CONFIG_FORCE_DPD_CALIB=y）</text>

  <line x1="480" y1="236" x2="480" y2="262" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="200" y="265" width="560" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="480" y="291" text-anchor="middle" font-size="17" fill="#1f2328">③ START_APP 命令 1037（FNCALL 0x130009）</text>
  <text x="480" y="311" text-anchor="middle" font-size="13" fill="#7d4e00">MCU1 老芯片收到不认识的命令</text>

  <line x1="480" y1="321" x2="480" y2="347" stroke="#656d76" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="200" y="350" width="560" height="56" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
  <text x="480" y="385" text-anchor="middle" font-size="17" fill="#1f2328">④ 等待约 4 秒 → 超时 → 驱动发起 USB 复位</text>

  <line x1="480" y1="406" x2="480" y2="432" stroke="#cf222e" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- step 5 -->
  <rect x="200" y="435" width="560" height="56" rx="10" fill="#cf222e"/>
  <text x="480" y="470" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">✕ 芯片假死：device descriptor read/64, error -110</text>

  <!-- bottom note -->
  <rect x="140" y="508" width="680" height="38" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1"/>
  <text x="480" y="532" text-anchor="middle" font-size="15" fill="#cf222e">软件复位 / USB 端口重启 / 重启电脑 全部无效 —— 唯一解法：物理拔插 ≥ 10 秒</text>
</svg>
