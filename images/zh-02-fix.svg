<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2da44e"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">修复方案：三层保险</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#656d76">任何一层都能阻止校准固件被上传 —— 芯片不再收到那条致命命令</text>

  <!-- layer 1 -->
  <rect x="30" y="100" width="286" height="196" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="173" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#0969da">第一层：出厂校准检测</text>
  <text x="173" y="162" text-anchor="middle" font-size="13.5" fill="#1f2328">读启动参数 0x1220f0 的 bit4</text>
  <text x="173" y="184" text-anchor="middle" font-size="13.5" fill="#1f2328">置位 → 出厂校准有效，直接跳过</text>
  <text x="173" y="214" text-anchor="middle" font-size="13.5" fill="#1f2328">未置位 → 读 flash 容量（0x40038030）</text>
  <text x="173" y="236" text-anchor="middle" font-size="13.5" fill="#1f2328">定位 DPD 信息（0xfe004 偏移）</text>
  <text x="173" y="266" text-anchor="middle" font-size="13.5" fill="#1f2328">bit7 置位 → 校准有效，跳过</text>

  <!-- layer 2 -->
  <rect x="337" y="100" width="286" height="196" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="480" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1a7f37">第二层：总开关（默认关）</text>
  <text x="480" y="166" text-anchor="middle" font-size="14" fill="#1f2328">新增模块参数</text>
  <text x="480" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">aicwf_dpd_fw_calib=0</text>
  <text x="480" y="224" text-anchor="middle" font-size="13.5" fill="#1f2328">只要不显式打开</text>
  <text x="480" y="246" text-anchor="middle" font-size="13.5" fill="#1f2328">永不上传校准固件</text>
  <text x="480" y="274" text-anchor="middle" font-size="13.5" fill="#1f2328">只做 misc_ram_init（12 字节清零）</text>

  <!-- layer 3 -->
  <rect x="644" y="100" width="286" height="196" rx="12" fill="#fbefff" stroke="#c297e3" stroke-width="1.5"/>
  <text x="787" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#8250df">第三层：MCU1 兼容配置</text>
  <text x="787" y="166" text-anchor="middle" font-size="13.5" fill="#1f2328">缓存寄存器修复（0x40100020）</text>
  <text x="787" y="196" text-anchor="middle" font-size="13.5" fill="#1f2328">patch_tbl_wifisetting 补 2 条</text>
  <text x="787" y="226" text-anchor="middle" font-size="13.5" fill="#1f2328">（看门狗 0x0004 / 0x0084）</text>
  <text x="787" y="258" text-anchor="middle" font-size="13.5" fill="#656d76">来自 legacy 分支的</text>
  <text x="787" y="278" text-anchor="middle" font-size="13.5" fill="#656d76">pre-SDK-V5 加载配置</text>

  <!-- merge arrows -->
  <line x1="173" y1="296" x2="173" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="480" y1="296" x2="480" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="787" y1="296" x2="787" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="173" y1="330" x2="787" y2="330" stroke="#656d76" stroke-width="1.5"/>
  <line x1="480" y1="330" x2="480" y2="352" stroke="#2da44e" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- success -->
  <rect x="200" y="356" width="560" height="62" rx="12" fill="#1a7f37"/>
  <text x="480" y="385" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Start app 0.3 秒成功 → wlan0 正常创建</text>
  <text x="480" y="408" text-anchor="middle" font-size="13" fill="#dafbe1">（修复前：4 秒超时 + 芯片假死）</text>
</svg>
